<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevFitLabs | Digital Growth & Operations for Fitness Businesses</title>
    <meta name="description" content="Leads. Appointments. Systems. All Done For You.">
    <link rel="stylesheet" href="style.css">
    
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="site-header">
        <div class="header-inner">
            <a href="#" class="brand-logo" aria-label="RevFitLabs Home">RevFitLabs</a>
            
            <nav class="desktop-nav">
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#work">Work</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>

            <button class="hamburger" aria-label="Toggle Navigation" aria-expanded="false" aria-controls="mobile-menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </header>

    <!-- Mobile Overlay Menu -->
    <div id="mobile-menu" class="mobile-menu-overlay" aria-hidden="true">
        <nav class="mobile-nav">
            <ul>
                <li class="nav-item"><a href="#home">Home</a></li>
                <li class="nav-item"><a href="#about">About</a></li>
                <li class="nav-item"><a href="#services">Services</a></li>
                <li class="nav-item"><a href="#work">Work</a></li>
                <li class="nav-item"><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </div>

    <!-- Hero Section -->
    <main>
        <section class="hero" id="home">
            <!-- Background Image -->
            <div class="hero-bg">
                <div class="hero-overlay"></div>
            </div>

            <div class="hero-content">
                <div class="hero-text-content">
                    <h1 class="hero-headline reveal">
                        <span class="font-light">Digital Growth & Operations</span><br>
                        <span class="font-bold">for Fitness Businesses.</span>
                        <div class="underline-accent"></div>
                    </h1>
                    <p class="hero-subheadline reveal delay-1">Leads. Appointments. Systems. All Done For You.</p>
                </div>
            </div>

            <!-- Floating CTA -->
            <a href="#contact" class="floating-cta reveal delay-2" aria-label="Let's Talk">
                <div class="cta-inner">
                    <svg viewBox="0 0 100 100" class="cta-svg-text">
                        <path id="circlePath" d="M 50, 50 m -35, 0 a 35,35 0 1,1 70,0 a 35,35 0 1,1 -70,0" fill="transparent" />
                        <text>
                            <textPath href="#circlePath" startOffset="0%" class="text-path">
                                LET'S TALK • LET'S TALK • LET'S TALK • 
                            </textPath>
                        </text>
                    </svg>
                    <div class="cta-circle">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </div>
                </div>
            </a>

            <!-- Massive Brand Text (Background/Bleeding off edges) -->
            <div class="massive-brand-text" aria-hidden="true">
                REVFITLABS
            </div>

            <!-- Scroll Indicator -->
            <div class="scroll-indicator">
                <span class="scroll-text">Explore</span>
                <div class="scroll-line"></div>
            </div>
        </section>
        
        <!-- Placeholder for future sections -->
        <section id="services" style="height: 100vh; background: #FFFFFF;"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
